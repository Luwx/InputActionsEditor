# Comprehensive InputActions config fixture for codec round-trip tests.
# Designed to be normalization-stable: condition leaves come before nested
# condition groups, gesture groups use the canonical nested form, and no
# decode-only sugar (legacy groups:/group: keys, nested sub-gestures,
# single-element list conditions, raw actions) is used.

autoreload: false
external_variable_access: false
emergency_combination: [backspace, enter, space]

notifications:
  config_error: false

# Unknown top-level key: must survive a round-trip untouched (Config.extra).
my_custom_extension:
  foo: bar
  count: 3

device_rules:
  - conditions: $name == Synaptics TM3276-022
    pressure_ranges:
      thumb: 75
      palm: 140

  - conditions:
      any:
        - $name contains Logitech
        - $mouse
    ignore: false

  - conditions: $mouse
    grab: true
    motion_timeout: 200
    motion_threshold: 1.5
    press_timeout: 300
    swipe:
      angle_tolerance: 25.0
    unblock_buttons_on_timeout: false
    buttonpad: true
    click_timeout: 50
    handle_evdev_events: true
    motion_threshold_2: 2.5
    motion_threshold_3: 3.5
    pressure_ranges:
      finger: 10
      thumb: 20
      palm: 30

  - ignore: true

mouse:
  speed:
    events: 4
    swipe_threshold: 20.0

  gestures:
    - type: stroke
      _extra:
        name: Draw circle
      id: stroke_circle
      mouse_buttons: [right]
      strokes:
        - OAMAAUkEBRZZEgwkYCARMmA6GUBSViRPQGMrYyNkNLAOVT3DAzhH0AUdUOkYC1j2OQBkAA==
      actions:
        - plasma_shortcut: kwin,Window Close

    - _extra:
        name: Navigation
      gestures:
        - type: swipe
          _extra:
            name: Meta + Swipe up
          direction: up
          mouse_buttons: [left]
          speed: fast
          lock_pointer: true
          block_events: false
          clear_modifiers: true
          resume_timeout: 500
          set_last_trigger: false
          accelerated: true
          threshold: 50
          conditions: $keyboard_modifiers == meta
          end_conditions: $window_fullscreen == false
          actions:
            - on: begin
              input:
                - keyboard: [leftctrl+home]

    - _extra:
        name: Media
        enabled: false
      gestures:
        - type: circle
          _extra:
            name: Volume circle
          direction: clockwise
          mouse_buttons: [middle]
          actions:
            - on: update
              interval: 3
              conflicting: false
              command: xdotool key XF86AudioRaiseVolume
              wait: true

    - type: press
      _extra:
        name: Instant back
        enabled: false
      mouse_buttons: [right, left]
      mouse_buttons_exact_order: true
      instant: true
      threshold: 100-200
      conditions: $keyboard_modifiers == meta
      actions:
        - on: begin
          id: press_back
          limit: 1
          input:
            - mouse: [back]
            - keyboard: [+leftctrl, +f10, -f10, -leftctrl]

    - type: wheel
      _extra:
        name: Wheel volume
      direction: up_down
      conditions:
        - $pointer_position_screen_percentage_x >= 0.99
        - any:
            - $window_maximized == true
            - $window_fullscreen == true
      actions:
        - on: update
          interval: '+'
          input:
            - keyboard: [volumedown]
        - on: update
          interval: '-'
          input:
            - keyboard: [volumeup]

keyboard:
  gestures:
    - type: shortcut
      _extra:
        name: Copy
      shortcut: [leftctrl, c]
      actions:
        - command: xdotool key ctrl+c
    - type: shortcut
      _extra:
        name: Type signature
      shortcut: [leftctrl, leftalt, s]
      actions:
        - on: begin
          input:
            - keyboard:
                - text: hello world

pointer:
  gestures:
    - type: hover
      _extra:
        name: Hover top-left
      conditions: $pointer_position_screen_percentage <= 0.01,0.01
      actions:
        - command: dolphin

touchpad:
  speed:
    events: 3
    swipe_threshold: 15.0
    pinch_in_threshold: 0.04
    pinch_out_threshold: 0.08
    rotate_threshold: 5.0

  gestures:
    - type: swipe
      _extra:
        name: Swipe 3 drag
      fingers: 3
      direction: any
      resume_timeout: 500
      accelerated: true
      actions:
        - on: begin
          input:
            - keyboard: [+leftmeta]
            - mouse: [+left]
        - on: update
          input:
            - mouse: [move_by_delta]
        - on: end_cancel
          input:
            - keyboard: [-leftmeta]
            - mouse: [-left]

    - type: swipe
      _extra:
        name: Angle swipe
      fingers: 4
      angle: 30.0-60.0
      bidirectional: true
      speed: slow
      actions:
        - command: echo angle

    - type: pinch
      _extra:
        name: Pinch 2 in
      fingers: 2
      direction: in
      actions:
        - plasma_shortcut: kwin,Window Close

    - type: rotate
      _extra:
        name: Rotate 2
      fingers: 2
      direction: counterclockwise
      actions:
        - on: update
          interval: -10
          input:
            - keyboard: [volumedown]

    - type: circle
      _extra:
        name: Circle 2
      fingers: 2
      direction: any
      actions:
        - sleep: 500

    - type: tap
      _extra:
        name: Tap 3
      fingers: 3
      actions:
        - command: echo tap

    - type: click
      _extra:
        name: Click 2
      fingers: 2
      actions:
        - command: echo click

    - type: hold
      _extra:
        name: Hold 2
      fingers: 2
      conditions:
        - $finger_1_position_percentage_x between 0.4;0.6
        - $finger_2_position_percentage_x < 0.5
      actions:
        - on: begin
          input:
            - keyboard: [a]

    - type: stroke
      _extra:
        name: Touchpad stroke
      fingers: 3
      strokes:
        - OAMAAUkEBRZZEgwkYCARMmA6GUBSViRPQGMrYyNkNLAOVT3DAzhH0AUdUOkYC1j2OQBkAA==
      actions:
        - command: echo stroke

touchscreen:
  gestures:
    - type: swipe
      _extra:
        name: TS swipe 2
      fingers: 2
      direction: left
      actions:
        - command: echo ts-swipe

    - type: pinch
      _extra:
        name: TS pinch
      fingers: 2
      direction: out
      actions:
        - command: echo ts-pinch

    - type: rotate
      _extra:
        name: TS rotate
      fingers: 2
      direction: clockwise
      actions:
        - command: echo ts-rotate

    - type: circle
      _extra:
        name: TS circle
      fingers: 2
      direction: any
      actions:
        - command: echo ts-circle

    - type: tap
      _extra:
        name: TS tap
      fingers: 1
      actions:
        - command: echo ts-tap

    - type: hold
      _extra:
        name: TS hold
      fingers: 2
      actions:
        - command: echo ts-hold

    - type: stroke
      _extra:
        name: TS stroke
      fingers: 3
      strokes:
        - OAMAAUkEBRZZEgwkYCARMmA6GUBSViRPQGMrYyNkNLAOVT3DAzhH0AUdUOkYC1j2OQBkAA==
      actions:
        - command: echo ts-stroke
