name: CI

on:
  push:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config build-essential \
            libgtk-3-dev liblzma-dev \
            qt6-base-dev extra-cmake-modules \
            libkf6iconthemes-dev libkf6service-dev

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build

      - name: Analyze
        run: flutter analyze

      - name: Build
        run: flutter build linux --release

      - name: Verify KDE helpers were built
        run: |
          BUNDLE=build/linux/x64/release/bundle
          test -x "$BUNDLE/kde_icon_lookup" || { echo "kde_icon_lookup missing"; exit 1; }
          test -x "$BUNDLE/kde_key_lookup" || { echo "kde_key_lookup missing"; exit 1; }
          echo "KDE helpers built successfully."
