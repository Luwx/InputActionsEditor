    - type: press
      instant: true
      mouse_buttons: [right, left]
      mouse_buttons_exact_order: true
      actions:
        - input:
          - keyboard: [ +leftctrl, +f10, -f10, -leftctrl ]

    - type: swipe
      direction: right
      mouse_buttons: [middle]
      actions:
        - input:
          - keyboard: [ +leftctrl, +f10, -f10, -leftctrl ]

    - type: swipe
      direction: left
      mouse_buttons: [middle]
      actions:
        - command: xdotool key super+c

    - type: swipe
      direction: down
      mouse_buttons: [middle]
      actions:
        - command: xdotool key super+Tab

    - type: swipe
      direction: up
      mouse_buttons: [middle]
      actions:
        - command: xdotool key super+shift+Tab

    - type: swipe
      direction: right_up
      mouse_buttons: [middle]
      actions:
        - command: xdotool key ctrl+t

    - type: swipe
      direction: up
      mouse_buttons: [right]
      actions:
        - command: xdotool key ctrl+w

    - type: swipe
      direction: down
      mouse_buttons: [right]
      actions:
        - command: xdotool key Escape

    - type: swipe
      direction: left
      mouse_buttons: [right]
      actions:
        - command: xdotool key BackSpace

    - type: swipe
      direction: right
      mouse_buttons: [right]
      actions:
        - command: xdotool key Delete

    - type: swipe
      direction: right_down
      mouse_buttons: [right]
      actions:
        - command: xdotool key Return

    - type: swipe
      direction: left_down
      mouse_buttons: [right]
      actions:
        - command: xdotool key Left

    - type: swipe
      direction: left_down
      mouse_buttons: [forward]
      actions:
        - command: xdotool key super+ctrl+Down

    - type: swipe
      direction: left
      mouse_buttons: [forward]
      actions:
        - command: xdotool key ctrl+shift+Tab

    - type: swipe
      direction: right
      mouse_buttons: [forward]
      actions:
        - command: xdotool key ctrl+Tab

    - type: swipe
      direction: up
      mouse_buttons: [forward]
      actions:
        - command: xdotool key XF86AudioRaiseVolume

    - type: swipe
      direction: down
      mouse_buttons: [forward]
      actions:
        - command: xdotool key XF86AudioLowerVolume

    - type: wheel
      direction: left
      mouse_buttons: [left]
      actions:
        - command: xdotool key a

    - type: wheel
      direction: right
      mouse_buttons: [left]
      actions:
        - command: xdotool key d

    - type: wheel
      direction: down
      conditions:
        - $pointer_position_screen_percentage_x >= 0.99
      actions:
        - command: xdotool key Left
          on: update
          interval: 4

    - type: wheel
      direction: up
      conditions:
        - $pointer_position_screen_percentage_x >= 0.99
      actions:
        - command: xdotool key Right
          on: update
          interval: 4

    - type: wheel
      direction: right
      conditions:
        - $pointer_position_screen_percentage_x >= 0.99
      actions:
        - command: xdotool key d

    - type: wheel
      direction: left
      conditions:
        - $pointer_position_screen_percentage_x >= 0.99
      actions:
        - command: xdotool key a

    - type: circle
      direction: clockwise
      mouse_buttons: [middle]
      actions:
        - command: xdotool key XF86AudioRaiseVolume
          on: update
          interval: 3

