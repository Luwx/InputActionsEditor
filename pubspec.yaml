name: input_actions_editor
description: "Input Actions configurator for managing shortcuts and input bindings."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.5.0+10

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  riverpod: ^3.2.1
  forui: ^0.22.0
  flutter_riverpod: ^3.3.1
  yaml: ^3.1.3
  # extended_text_field: ^16.0.2
  extended_text_field:
    git:
      url: https://github.com/shkvoretz/extended_text_field.git
      ref: master
  yaml_edit: ^2.2.4
  collection: ^1.19.1
  freezed_annotation: ^3.0.0
  dbus: ^0.7.12
  flutter_svg: ^2.0.0
  pixel_snap: ^0.1.5
  scroll_animator: ^0.3.0
  show_fps: ^1.1.0
  shared_preferences: ^2.3.3
  kwin_blur:
    git:
      url: https://github.com/Luwx/klutter
      path: kwin_blur
  kde_color_scheme:
    git:
      url: https://github.com/Luwx/klutter
      path: kde_color_scheme
  flutter_animate: ^4.5.2
  animations: ^2.2.0
  window_manager: ^0.5.1
  equatable: ^2.0.8
  meta: ^1.18.0
  edit_schema_generator:
    git:
      url: https://github.com/Luwx/dart_generators
      path: edit_schema_generator
  meta_generator:
    git:
      url: https://github.com/Luwx/dart_generators
      path: meta_generator
  flutter_hooks: ^0.21.3+1
  hooks_riverpod: ^3.3.1
  forui_hooks: ^0.22.1
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  very_good_analysis: ^10.2.0
  build_runner: ^2.4.13
  freezed: ^3.0.0

flutter:
  generate: true

  uses-material-design: true

  fonts:
    - family: PlasmaIcons
      fonts:
        - asset: assets/fonts/PlasmaIcons.ttf